<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colecciones y Racha</title>
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Google Fonts (Fredoka) -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        :root {
            --yellow-accent: #fcd72b;
            --yellow-hover: #ebd020;
            --border-color: #000000;
            --red-streak: #E52421;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Fredoka', sans-serif;
            background-color: #FFF085;
            color: #000000;
            user-select: none;
        }

        /* Layout principal pantalla completa */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100vw;
            justify-content: space-between;
        }

        /* Franja amarilla superior de borde a borde (sin línea negra) */
        .header-amarillo {
            background-color: var(--yellow-accent);
            padding: 30px 10px;
            text-align: center;
            width: 100%;
            border-bottom: none; /* Línea negra eliminada */
        }

        .header-amarillo h4 {
            margin: 0;
            color: var(--border-color);
            font-weight: 700;
            font-size: 3.6rem; /* Letras más grandes */
            letter-spacing: 0.5px;
        }

        /* Contenido central distribuido */
        .contenido-fullscreen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 5%;
            width: 100%;
        }

        .row-fullscreen {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto !important;
        }

        /* SECCIÓN DE COLECCIONES (IZQUIERDA) */
        .card-colecciones {
            position: relative;
            background: #FFFFFF;
            border: 3px solid var(--border-color);
            border-radius: 30px;
            padding: 45px 25px 30px 25px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            margin-top: 15px;
        }

        /* Insignia del título 'Colecciones' */
        .badge-header {
            position: absolute;
            top: -24px;
            left: 25px;
            background-color: var(--yellow-accent);
            border: 3px solid var(--border-color);
            border-radius: 25px;
            padding: 6px 35px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #000;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        /* Mariposa decorativa flotante */
        .butterfly-img {
            position: absolute;
            top: -42px;
            right: 10px;
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.15));
            z-index: 10;
            animation: floatSlow 3s ease-in-out infinite alternate;
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(6deg); }
        }

        /* Grid interno 2x2 para ítems */
        .grid-colecciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px 15px;
            text-align: center;
            margin-top: 10px;
        }

        .item-coleccion {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .item-coleccion:hover {
            transform: scale(1.1);
        }

        .item-icon-img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .item-label {
            font-size: 1.3rem;
            font-weight: 700;
            color: #000;
        }

        /* SECCIÓN DERECHA: REGALO Y RACHA */
        .right-column-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 10px;
        }

        .card-gift {
            background-color: #FFFFFF;
            border: 3px solid var(--yellow-accent);
            border-radius: 30px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(255, 220, 0, 0.2);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-gift:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(255, 220, 0, 0.35);
        }

        .gift-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .gift-info {
            flex-grow: 1;
            padding-left: 15px;
        }

        .gift-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000;
            margin: 0;
            line-height: 1.2;
        }

        .gift-subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin: 3px 0 0 0;
        }

        .arrow-icon {
            font-size: 2.5rem !important;
            font-weight: bold;
            color: #000;
        }

        /* SECCIÓN DE DÍAS DE RACHA */
        .racha-section {
            text-align: center;
            background: #FAFAFA;
            border: 3px solid #eee;
            border-radius: 30px;
            padding: 20px;
        }

        .racha-title {
            font-size: 2rem;
            font-weight: 700;
            color: #000;
            margin: 0 0 15px 0;
        }

        .racha-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .racha-circle {
            background-color: var(--red-streak);
            color: var(--yellow-accent);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(229, 36, 33, 0.3);
            border: 3px solid var(--border-color);
        }

        .racha-slash {
            font-size: 4rem;
            font-weight: 400;
            color: #000;
            transform: rotate(15deg);
            margin: 0 5px;
        }

        /* Botón flotante siguiente (esquina inferior derecha) */
        .btn-next-floating {
            position: fixed;
            bottom: 35px;
            right: 40px;
            width: 75px;
            height: 75px;
            background-color: var(--yellow-accent);
            border: 3px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            z-index: 99;
            text-decoration: none;
        }

        .btn-next-floating:hover {
            transform: scale(1.1);
            background-color: var(--yellow-hover);
        }

        .btn-next-floating i {
            font-size: 3rem;
            color: var(--border-color);
            font-weight: bold;
        }

        /* Adaptabilidad móvil */
        @media (max-width: 600px) {
            .header-amarillo h4 {
                font-size: 2.6rem;
            }
            .badge-header {
                font-size: 1.4rem;
                padding: 4px 20px;
            }
            .racha-title {
                font-size: 1.6rem;
            }
            .racha-circle {
                width: 65px;
                height: 65px;
                font-size: 2.1rem;
            }
            .gift-title {
                font-size: 1.2rem;
            }
            .btn-next-floating {
                bottom: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
            }
            .btn-next-floating i {
                font-size: 2.3rem;
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Franja Superior Amarilla -->
    <div class="header-amarillo">
        <h4>¡Bienvenido de nuevo!</h4>
    </div>

    <!-- Contenido Principal -->
    <div class="contenido-fullscreen">
        <div class="row row-fullscreen valign-wrapper">
            
            <!-- COLUMNA IZQUIERDA: COLECCIONES -->
            <div class="col s12 m6">
                <div class="card-colecciones">
                    <!-- Insignia Título -->
                    <div class="badge-header">
                        Colecciones
                    </div>

                    <!-- Mariposa Decorativa -->
                    <img src="https://img.icons8.com/emoji/96/butterfly-emoji.png" alt="Mariposa" class="butterfly-img" onerror="this.src='https://placehold.co/80x80/FFDC00/000?text=🦋'">

                    <!-- Grid 2x2 -->
                    <div class="grid-colecciones">
                        <!-- 1. Accesorios (Osito) -->
                        <div class="item-coleccion">
                            <img src="https://img.icons8.com/emoji/96/bear-emoji.png" alt="Accesorios" class="item-icon-img" onerror="this.src='https://placehold.co/75x75/C68A68/FFF?text=Oso'">
                            <span class="item-label">Accesorios</span>
                        </div>

                        <!-- 2. Estrellas -->
                        <div class="item-coleccion">
                            <img src="https://img.icons8.com/emoji/96/star-emoji.png" alt="Estrellas" class="item-icon-img" onerror="this.src='https://placehold.co/75x75/FFD54F/000?text=★'">
                            <span class="item-label">Estrellas</span>
                        </div>

                        <!-- 3. Medallas -->
                        <div class="item-coleccion">
                            <img src="https://img.icons8.com/emoji/96/1st-place-medal-emoji.png" alt="Medallas" class="item-icon-img" onerror="this.src='https://placehold.co/75x75/E52421/FFF?text=Medalla'">
                            <span class="item-label">Medallas</span>
                        </div>

                        <!-- 4. Progreso -->
                        <div class="item-coleccion">
                            <img src="https://img.icons8.com/fluency/96/doughnut-chart.png" alt="Progreso" class="item-icon-img" onerror="this.src='https://placehold.co/75x75/E52421/FFF?text=Progreso'">
                            <span class="item-label">Progreso</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: REGALO Y RACHA -->
            <div class="col s12 m6">
                <div class="right-column-container">
                    
                    <!-- Tarjeta Regalo -->
                    <div class="card-gift">
                        <img src="https://img.icons8.com/emoji/96/wrapped-gift-emoji.png" alt="Regalo" class="gift-img" onerror="this.src='https://placehold.co/60x60/FFC107/FFF?text=🎁'">
                        <div class="gift-info">
                            <h5 class="gift-title">¡Consigue una estrella!</h5>
                            <p class="gift-subtitle">Completa una actividad</p>
                        </div>
                        <i class="material-icons arrow-icon">chevron_right</i>
                    </div>

                    <!-- Sección Racha -->
                    <div class="racha-section">
                        <h4 class="racha-title">Días de Racha</h4>
                        <div class="racha-display">
                            <div class="racha-circle">3</div>
                            <div class="racha-slash">/</div>
                            <div class="racha-circle">7</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Botón Flotante Siguiente -->
<a href="#" class="btn-next-floating tooltipped" data-position="top" data-tooltip="ir a la Siguiente <br> pagina">
    <i class="material-icons">arrow_forward</i>
</a>

<!-- Materialize JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var elems = document.querySelectorAll('.tooltipped');
    M.Tooltip.init(elems);
  });
</script>
</body>
</html>
