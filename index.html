<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | Grizzly</title>

  <!-- Google Material Icons & Google Fonts -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #FFF59E; /* Fondo inferior claro */
      font-family: 'Fredoka', cursive, sans-serif;
      overflow: hidden;
    }

    .hero-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fondo curvo superior */
    .seccion-curva {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65vh;
      background-color: #F8DF32; /* Amarillo principal */
      border-radius: 0 0 50% 50% / 0 0 35% 35%;
      z-index: 1;
    }

    /* Contenedor central principal */
    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      height: 620px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* SVG del texto con arco super curvo */
    .curved-text-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 5;
    }

    .curved-text-svg text {
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      font-weight: 700;
      fill: #111111;
      letter-spacing: 0.3px;
    }

    /* Imagen del Oso (Centrada exactamente bajo la cúpula del texto) */
    .mascot-img {
      width: 330px;
      max-width: 100%;
      height: auto;
      margin-top: 130px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.06));
    }

    /* Botón flotante inferior derecho */
    .btn-floating-custom {
      position: fixed;
      right: 32px;
      bottom: 32px;
      z-index: 10;
      background-color: #F8DF32 !important;
      border: 2px solid #111111;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s ease;
    }

    .btn-floating-custom:hover {
      transform: scale(1.08);
      background-color: #f5d410 !important;
    }

    .btn-floating-custom i {
      color: #111111 !important;
      font-size: 2rem !important;
      line-height: 56px;
    }
  </style>
</head>
<body>
<script>
        // =================================================================
// REPRODUCTOR DE MÚSICA EN BUCLE Y BOTÓN FLOTANTE GENERADO POR JS
// =================================================================

document.addEventListener('DOMContentLoaded', () => {
    // 1. Crear el elemento de audio para la música de fondo
    const bgAudio = document.createElement('audio');
    bgAudio.id = 'bg-music-loop';
    bgAudio.src = 'https://fab-rodz.github.io/Grizzly/musica.mp3'; // <-- REEMPLAZA por la ruta de tu archivo audio (.mp3 / .wav)
    bgAudio.loop = true; // Activa el bucle infinito
    bgAudio.volume = 0.4; // Ajusta el volumen inicial (0.0 a 1.0)

    // Insertar el elemento de audio en el cuerpo de la página
    document.body.appendChild(bgAudio);

    // 2. Crear el botón de silencio/activación generado dinámicamente
    const muteBtn = document.createElement('button');
    muteBtn.id = 'btn-toggle-bg-music';
    
    // Ícono por defecto (usa FontAwesome o emojis)
    muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; // Si no usas FontAwesome puedes usar: '🔊'
    muteBtn.title = 'Silenciar / Activar Música de Fondo';

    // 3. Aplicar estilos CSS directamente al botón desde JavaScript
    Object.assign(muteBtn.style, {
        position: 'fixed',
        bottom: '25px',
        left: '25px',
        width: '55px',
        height: '55px',
        borderRadius: '50%',
        border: 'none',
        backgroundColor: '#FFDC00', // Color amarillo acorde a tu juego
        color: '#1a1a1a',
        fontSize: '1.5rem',
        cursor: 'pointer',
        boxShadow: '0 4px 15px rgba(0, 0, 0, 0.25)',
        zIndex: '9999',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        transition: 'transform 0.2s ease, background-color 0.2s ease'
    });

    // Animaciones hover al pasar el cursor
    muteBtn.addEventListener('mouseenter', () => muteBtn.style.transform = 'scale(1.1)');
    muteBtn.addEventListener('mouseleave', () => muteBtn.style.transform = 'scale(1.0)');

    // 4. Lógica de Silenciar / Activar
    let isMuted = false;

    muteBtn.addEventListener('click', () => {
        // Si el navegador bloqueó el autoplay inicial, se inicia con el primer clic
        if (bgAudio.paused) {
            bgAudio.play().catch(err => console.log("Error al reproducir audio:", err));
        }

        isMuted = !isMuted;
        bgAudio.muted = isMuted;

        // Actualizar icono y color del botón según el estado
        if (isMuted) {
            muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>'; // O emoji: '🔇'
            muteBtn.style.backgroundColor = '#e74c3c'; // Rojo cuando está silenciado
            muteBtn.style.color = '#ffffff';
        } else {
            muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; // O emoji: '🔊'
            muteBtn.style.backgroundColor = '#FFDC00'; // Amarillo cuando suena
            muteBtn.style.color = '#1a1a1a';
        }
    });

    // 5. Insertar el botón en el cuerpo de la página
    document.body.appendChild(muteBtn);

    // 6. Iniciar reproducción automática con la primera interacción del usuario
    // (Requerido por las políticas de autoplay de navegadores modernos)
    const startAudioOnInteraction = () => {
        if (bgAudio.paused && !isMuted) {
            bgAudio.play().catch(() => {});
        }
        window.removeEventListener('click', startAudioOnInteraction);
        window.removeEventListener('touchstart', startAudioOnInteraction);
    };

    window.addEventListener('click', startAudioOnInteraction);
    window.addEventListener('touchstart', startAudioOnInteraction);
});
    </script>
  <div class="hero-container">
    <div class="seccion-curva"></div>

    <div class="content-wrapper">

      <!-- SVG con trayecto semicircular de alto grado de curvatura -->
      <svg class="curved-text-svg" viewBox="0 0 700 620">
        <!-- Arco semicircular cerrado (Radio 235px, caída vertical de 170px) -->
        <path id="text-arc" d="M 120,310 A 235,235 0 0,1 580,310" fill="none"/>
        
        <text>
          <textPath href="#text-arc" startOffset="50%" text-anchor="middle">
            ¡Aprendamos jugando con Grizzly, comenzemos!
          </textPath>
        </text>
      </svg>

      <!-- Personaje Oso -->
      <img src="img/mascota_saludando.png" 
           alt="Grizzly Mascot" 
           class="mascot-img">
    </div>

    <!-- Botón Flotante -->
    <a class="btn-floating btn-large waves-effect waves-light btn-floating-custom" href="ya tienes una cuenta.html">
      <i class="material-icons">arrow_forward</i>
    </a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
