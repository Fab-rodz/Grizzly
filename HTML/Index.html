<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | Grizzly</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <style>
    body {
      margin: 0;
      background-color: #FFF59E; /* Tono claro inferior */
    }

    .seccion-curva {
      width: 100%;
      height: 55vh; /* Aumenta este valor para que baje más en la pantalla */
      background-color: #F8DF32; /* Tono amarillo principal */
      /* El valor 50% / 45% hace la panza de la curva más profunda hacia abajo */
      border-radius: 0 0 50% 50% / 0 0 45% 45%; 
    }
  </style>
</head>
<body>
  <div class="seccion-curva"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
