<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cómo se llama</title>

    <!-- Materialize CSS CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    
    <!-- Google Fonts & Material Icons / FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --yellow-accent: #FFDC00;
            --yellow-dark: #f1c40f;
            --text-dark: #1a1a1a;
            --bg-light: #FAFAFA;
           
            --header-yellow: #FFDC00;
            --btn-red: #e74c3c;
            --btn-blue: #3498db;
            --btn-green: #2ecc71;
        }

        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background-color: #FFF085;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
            overflow-x: hidden;
        }

        
         .header-vocal {
            background-color: var(--yellow-accent);
            padding: 22px 10px;
            text-align: center;
            border-bottom: 3px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 15px rgba(255, 220, 0, 0.3);
            position: relative;
        }

        .header-vocal h1 {
            margin: 0;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

      
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .instruction {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 35px;
            text-align: center;
        }

        .content-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 850px;
            flex-wrap: wrap;
        }

      
        .image-card {
            background-color: #ffffff;
            border: 4px solid var(--header-yellow);
            border-radius: 20px;
            padding: 15px;
            width: 340px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
        }

        .image-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 230px;
        }

        .btn-audio {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 100%;
        }

        .btn-audio:active {
            transform: scale(0.95);
        }

        .btn-audio i {
            margin-right: 18px;
            font-size: 1.5rem;
        }

        .btn-red { background-color: var(--btn-red); }
        .btn-blue { background-color: var(--btn-blue); }
        .btn-green { background-color: var(--btn-green); }

      
        .btn-next-floating {
            position: fixed;
            bottom: 30px;
            right: 35px;
            width: 65px;
            height: 65px;
            background-color: var(--header-yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
             box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s ease;
            text-decoration: none;
            z-index: 90;
            margin: bg black;;
        }

        .btn-next-floating:hover {
            transform: scale(1.08);
        }

        .btn-next-floating i {
            font-size: 2.5rem;
            color: var(--text-dark);
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .content-wrapper {
                gap: 25px;
            }
            .image-card {
                width: 290px;
                height: 180px;
            }
            .options-container {
                width: 200px;
            }
            .btn-next-floating {
                width: 55px;
                height: 55px;
                bottom: 20px;
                right: 20px;
            }
            .btn-next-floating i {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

   
    <header class="header-vocal">
        <h1>Cómo se llama</h1>
    </header>

   
    <main class="main-container">
        <p class="instruction">Observa la imagen y elige el nombre correcto</p>

        <div class="content-wrapper">
            <!-- TARJETA CON LA IMAGEN DE LA ABEJA -->
            <div class="image-card">
                <img id="mainImage" src="img/elefante.png" alt="Abeja">
            </div>

            <!-- BOTONES DE AUDIO -->
            <div class="options-container">
                <button class="btn-audio btn-red" onclick="reproducirAudio('audio-abeja')">
                    <i class="fa-solid fa-volume-high"></i>
                    <span>  Abeja</span>
                </button>

                <button class="btn-audio btn-blue" onclick="reproducirAudio('audio-oso')">
                    <i class="fa-solid fa-volume-high"></i>
                    <span>  Oso</span>
                </button>

                <button class="btn-audio btn-green" onclick="reproducirAudio('audio-sapo')">
                    <i class="fa-solid fa-volume-high"></i>
                    <span>  Sapo</span>
                </button>
            </div>
        </div>
    </main>

   
    <a href="#" class="btn-next-floating tooltipped" data-position="top" data-tooltip="Siguiente">
        <i class="material-icons">arrow_forward</i>
    </a>


    <audio id="audio-abeja" src="audios/abeja.mp3"></audio>
    <audio id="audio-oso" src="audios/oso.mp3"></audio>
    <audio id="audio-sapo" src="audios/sapo.mp3"></audio>

    <!-- Materialize JS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            M.Tooltip.init(document.querySelectorAll('.tooltipped'));
        });

        function reproducirAudio(idAudio) {
            // Detener cualquier otro audio reproduciéndose
            const audios = document.querySelectorAll('audio');
            audios.forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });

            // Reproducir el audio correspondiente al botón
            const audioSelect = document.getElementById(idAudio);
            if (audioSelect) {
                audioSelect.play().catch(error => {
                    console.log("No se pudo reproducir el audio. Verifica la ruta del archivo mp3:", error);
                });
            }
        }
    </script>
</body>
</html>
