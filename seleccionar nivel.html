<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Nivel | Grizzly</title>

  <!-- Google Material Icons & Fuente Fredoka -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background-color: #FFF59E;
      font-family: 'Fredoka', cursive, sans-serif;
      overflow-x: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* 1. Encabezado Superior Más Grande (22vh) */
    .header-bar {
      background-color: #F8DF32;
      height: 22vh;
      min-height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      border-radius: 0 0 25px 25px;
    }

    .header-bar h1 {
      margin: 0;
      font-size: 3.5rem;
      font-weight: 700;
      color: #111111;
      text-align: center;
    }

    /* Subtítulo Central */
    .subtitle {
      text-align: center;
      font-size: 2.3rem;
      font-weight: 700;
      color: #111111;
      margin: 15px 0 10px 0;
      z-index: 2;
    }

    /* Contenido Principal con Flexbox */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      padding: 0 5%;
      z-index: 2;
    }

    /* Layout principal: Oso a la izquierda y Niveles a la derecha */
    .layout-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1100px;
      margin-top: 10px;
      gap: 30px;
    }

    /* 2. Sección del Oso (Más grande y bien centrado a la izquierda) */
    .bear-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .decor-bear {
      width: 100%;
      max-width: 380px;
      height: auto;
      filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.08));
    }

    /* 3. Sección de Niveles Alineada a la Derecha */
    .levels-section {
      flex: 1.2;
      display: flex;
      justify-content: flex-end;
    }

    .levels-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 25px;
      width: 100%;
      max-width: 560px;
    }

    /* Tarjetas de Nivel (Estilo Óvalo) */
    .level-card {
      background-color: #FFFDE7;
      border-radius: 35px;
      padding: 15px 20px;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 95px;
      text-decoration: none;
      color: #111111;
      border: 2px solid transparent;
    }

    .level-card:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border-color: #F8DF32;
    }

    .level-card .card-top-text {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 6px;
      margin-bottom: 2px;
    }

    .level-card .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111111;
      margin: 0;
    }

    .stars-container {
      display: flex;
      gap: 3px;
      margin-bottom: 4px;
    }

    .stars-container i {
      color: #F8DF32;
      font-size: 1.9rem;
      -webkit-text-stroke: 1px #e0b800;
    }

    /* Ilustraciones de Fondo */
    .decor-sun {
      position: absolute;
      top: 10px;
      left: 4%;
      width: 140px;
      z-index: 1;
      pointer-events: none;
    }

    .decor-bird {
      position: absolute;
      top: 15px;
      right: 4%;
      width: 110px;
      z-index: 1;
      pointer-events: none;
    }

    .decor-rocks {
      position: absolute;
      bottom: 0;
      right: 1%;
      width: 220px;
      z-index: 1;
      pointer-events: none;
    }

    /* Diseño Responsivo */
    @media (max-width: 992px) {
      .header-bar h1 { font-size: 2.8rem; }
      .subtitle { font-size: 1.8rem; }
      .layout-wrapper { flex-direction: column; gap: 20px; align-items: center; }
      .levels-section { justify-content: center; width: 100%; }
      .decor-bear { max-width: 280px; }
      .decor-sun, .decor-bird { display: none; }
    }

    @media (max-width: 600px) {
      .header-bar { height: 18vh; }
      .header-bar h1 { font-size: 2.2rem; }
      .subtitle { font-size: 1.4rem; margin: 15px 0; }
      .levels-container { grid-template-columns: 1fr; max-width: 320px; }
      .decor-bear { max-width: 220px; }
      .decor-rocks { display: none; }
    }
  </style>
</head>
<body>
<script>
        // =================================================================
// REPRODUCTOR DE MÚSICA EN BUCLE Y BOTÓN FLOTANTE GENERADO POR JS
// =================================================================

document.addEventListener('DOMContentLoaded', () => {
    // 1. Crear el elemento de audio para la música de fondo
    const bgAudio = document.createElement('audio');
    bgAudio.id = 'bg-music-loop';
    bgAudio.src = 'https://fab-rodz.github.io/Grizzly/musica.mp3'; // <-- REEMPLAZA por la ruta de tu archivo audio (.mp3 / .wav)
    bgAudio.loop = true; // Activa el bucle infinito
    bgAudio.volume = 0.4; // Ajusta el volumen inicial (0.0 a 1.0)

    // Insertar el elemento de audio en el cuerpo de la página
    document.body.appendChild(bgAudio);

    // 2. Crear el botón de silencio/activación generado dinámicamente
    const muteBtn = document.createElement('button');
    muteBtn.id = 'btn-toggle-bg-music';
    
    // Ícono por defecto (usa FontAwesome o emojis)
    muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; // Si no usas FontAwesome puedes usar: '🔊'
    muteBtn.title = 'Silenciar / Activar Música de Fondo';

    // 3. Aplicar estilos CSS directamente al botón desde JavaScript
    Object.assign(muteBtn.style, {
        position: 'fixed',
        bottom: '25px',
        left: '25px',
        width: '55px',
        height: '55px',
        borderRadius: '50%',
        border: 'none',
        backgroundColor: '#FFDC00', // Color amarillo acorde a tu juego
        color: '#1a1a1a',
        fontSize: '1.5rem',
        cursor: 'pointer',
        boxShadow: '0 4px 15px rgba(0, 0, 0, 0.25)',
        zIndex: '9999',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        transition: 'transform 0.2s ease, background-color 0.2s ease'
    });

    // Animaciones hover al pasar el cursor
    muteBtn.addEventListener('mouseenter', () => muteBtn.style.transform = 'scale(1.1)');
    muteBtn.addEventListener('mouseleave', () => muteBtn.style.transform = 'scale(1.0)');

    // 4. Lógica de Silenciar / Activar
    let isMuted = false;

    muteBtn.addEventListener('click', () => {
        // Si el navegador bloqueó el autoplay inicial, se inicia con el primer clic
        if (bgAudio.paused) {
            bgAudio.play().catch(err => console.log("Error al reproducir audio:", err));
        }

        isMuted = !isMuted;
        bgAudio.muted = isMuted;

        // Actualizar icono y color del botón según el estado
        if (isMuted) {
            muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>'; // O emoji: '🔇'
            muteBtn.style.backgroundColor = '#e74c3c'; // Rojo cuando está silenciado
            muteBtn.style.color = '#ffffff';
        } else {
            muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; // O emoji: '🔊'
            muteBtn.style.backgroundColor = '#FFDC00'; // Amarillo cuando suena
            muteBtn.style.color = '#1a1a1a';
        }
    });

    // 5. Insertar el botón en el cuerpo de la página
    document.body.appendChild(muteBtn);

    // 6. Iniciar reproducción automática con la primera interacción del usuario
    // (Requerido por las políticas de autoplay de navegadores modernos)
    const startAudioOnInteraction = () => {
        if (bgAudio.paused && !isMuted) {
            bgAudio.play().catch(() => {});
        }
        window.removeEventListener('click', startAudioOnInteraction);
        window.removeEventListener('touchstart', startAudioOnInteraction);
    };

    window.addEventListener('click', startAudioOnInteraction);
    window.addEventListener('touchstart', startAudioOnInteraction);
});
    </script>
  <div class="app-container">
    <!-- Encabezado con el Nombre de Usuario Dinámico -->
    <header class="header-bar">
      <h1>¡Bienvenido <span id="nombre-usuario">Amigo</span>!</h1>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">
      <h2 class="subtitle">¡Aprendamos jugando, Comenzemos!</h2>
      <!-- Wrapper para dividir Oso (Izquierda) y Niveles (Derecha) -->
      <div class="layout-wrapper">
        
        <!-- Sección del Oso Grande -->
        <div class="bear-section">
          <img src="img/mascota_feliz.png" alt="Oso con estrellas" class="decor-bear">
        </div>

        <!-- Sección de los Niveles -->
        <div class="levels-section">
          <div class="levels-container">
            
            <!-- Nivel Básico -->
            <a href="#" class="level-card">
              <div class="card-top-text">A E U</div>
              <p class="card-title">Nivel Basico</p>
            </a>

            <!-- Nivel 1 -->
            <a href="nivel 1/ruleta A.html" class="level-card">
              <div class="stars-container">
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
              </div>
              <p class="card-title">Nivel 1</p>
            </a>

            <!-- Nivel Intermedio -->
            <a href="#" class="level-card">
              <div class="card-top-text">A E U</div>
              <p class="card-title">Nivel Intermedio</p>
            </a>

            <!-- Nivel 2 -->
            <a href="nivel 2/comosellamaabeja.html" class="level-card">
              <div class="stars-container">
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
              </div>
              <p class="card-title">Nivel 2</p>
            </a>

            <!-- Nivel Avanzado -->
            <a href="#" class="level-card">
              <div class="card-top-text">A E U</div>
              <p class="card-title">Nivel Avanzado</p>
            </a>

            <!-- Nivel 3 -->
            <a href="nivel 3/nivel3.html" class="level-card">
              <div class="stars-container">
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
                <i class="material-icons">star</i>
              </div>
              <p class="card-title">Nivel 3</p>
            </a>

          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Materialize JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

  <script>
    // Cargar el nombre guardado desde localStorage (de la sesión activa)
    document.addEventListener('DOMContentLoaded', () => {
      const sesion = localStorage.getItem('usuarioSesion');
      const nombreUsuarioSpan = document.getElementById('nombre-usuario');

      if (sesion) {
        try {
          const usuarioData = JSON.parse(sesion);
          if (usuarioData && usuarioData.nombre) {
            nombreUsuarioSpan.textContent = usuarioData.nombre;
          }
        } catch (error) {
          console.error("Error al procesar la sesión de usuario:", error);
        }
      }
    });
  </script>
</body>
</html>
